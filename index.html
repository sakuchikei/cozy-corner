<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chika’s Cozy Corner</title>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:linear-gradient(180deg,#cdc2f6 0%,#f2cdea 50%,#ffe4ec 100%);--card:rgba(255,255,255,.82);--ink:#4b3a73;--soft:#8a76b5;--acc:#a85fd1;--line:#dccff7;--pink:#ffd5e6;--blue:#d6e5ff;--yellow:#fff0b3;--chip:#fff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root[data-theme="dark"]{--bg:linear-gradient(180deg,#1a1432 0%,#2a1c4a 55%,#3a2350 100%);--card:rgba(40,30,72,.85);--ink:#efe6ff;--soft:#b9a6e6;--acc:#d9a6ff;--line:#4d3d82;--pink:#5a2f56;--blue:#2c3f70;--yellow:#5c5130;--chip:#352a5e;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg) fixed;color:var(--ink);font:20px/1.35 Gaegu,"Comic Sans MS",ui-rounded,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.wrap{max-width:1200px;margin:0 auto;padding:12px}
.hero{text-align:center;padding:24px 8px 4px}
h1{font-size:clamp(34px,6vw,58px);margin:0;color:var(--acc);line-height:1}
.hero p{margin:6px 0;color:var(--soft);font-size:22px}
.cat{font-size:44px;display:inline-block}
@media(prefers-reduced-motion:no-preference){.cat{animation:fl 4s ease-in-out infinite}}
@keyframes fl{50%{transform:translateY(-6px)}}
nav{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;background:var(--card);border-radius:32px;padding:6px;margin:10px auto 14px;width:fit-content;max-width:100%}
.navb{border:0;background:none;border-radius:24px;padding:6px 14px}
.navb.on{background:var(--pink);font-weight:700}
.grid{display:grid;grid-template-columns:170px 1fr 290px;gap:14px;align-items:start}
.mid{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}
.span{grid-column:1/-1}
.side,.right{display:flex;flex-direction:column;gap:14px}
.side .lead{text-align:center;font-size:30px;line-height:1.1;color:var(--acc)}
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:14px 16px;backdrop-filter:blur(6px)}
.card h3{margin:0 0 8px;font-size:23px;display:flex;justify-content:space-between;align-items:center}
.card.pink,.note.pink,.tile.t0{background:var(--pink)}
.card.blue,.note.blue,.tile.t1{background:var(--blue)}
.note.yellow,.tile.t2{background:var(--yellow)}
.soft{color:var(--soft)}
.btn,.chip,.sb{border:2px solid var(--line);background:var(--chip);border-radius:16px;padding:4px 12px}
.btn{background:var(--acc);color:#fff;border-color:transparent;font-weight:700}
.sb{width:100%;text-align:left}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.chip.on{background:var(--acc);color:#fff}
.chk{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:2px 0}
.chk input{accent-color:var(--acc);width:18px;height:18px;margin-right:8px}
.done{text-decoration:line-through;opacity:.6}
.x{border:0;background:none;color:var(--soft);font-size:22px}
.row{display:flex;gap:6px;margin-bottom:6px}
input[type=text],input[type=email],textarea,select{background:var(--chip);border:2px solid var(--line);border-radius:12px;padding:6px 10px;width:100%}
.row input{flex:1;min-width:0}
.cover{font-size:34px;background:var(--blue);border-radius:12px;width:62px;height:62px;display:grid;place-items:center;flex:none}
.bar{height:6px;background:var(--line);border-radius:6px;margin:10px 0 2px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:6px}
.ctl{display:flex;justify-content:center;align-items:center;gap:14px}
.ctl button{border:0;background:none;font-size:24px}
.ctl .big{background:var(--acc);color:#fff;border-radius:50%;width:54px;height:54px;font-size:22px}
.clock{display:flex;gap:14px;align-items:center}
.time{font-size:34px}
.big-emoji{font-size:44px}
.ints{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;text-align:center}
.int{border:0;background:none;padding:6px;border-radius:14px}
.int:hover{background:var(--blue)}
.int span{display:block;font-size:40px}
.quote{display:grid;place-items:center;text-align:center;font-size:26px;background:var(--pink);border:2px solid var(--line);border-radius:20px;padding:14px;color:var(--ink)}
.banner{display:grid;place-items:center;font-size:64px;background:var(--blue);border:2px solid var(--line);border-radius:20px;min-height:150px}
.notes,.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.note{border-radius:14px;padding:12px;min-height:110px;display:flex;flex-direction:column;justify-content:space-between;color:#4b3a73;position:relative}
:root[data-theme="dark"] .note{color:#f3ebff}
.note small{opacity:.7}
.note .x{position:absolute;top:2px;right:6px}
.nform{display:grid;grid-template-columns:1fr auto auto auto;gap:8px;align-items:start}
.nform textarea{min-height:48px;resize:vertical}
.nform select{width:auto}
.tile{border:2px solid var(--line);border-radius:16px;min-height:120px;display:grid;place-items:center;align-content:center;color:var(--ink)}
.tile span{font-size:46px}
.tile.big{width:min(340px,86vw);min-height:260px;font-size:26px}
.modal{position:fixed;inset:0;background:rgba(20,10,40,.55);display:grid;place-items:center;z-index:5}
.col{display:grid;gap:10px;max-width:480px}
.err{color:#d6457f;margin:0}
footer{text-align:center;color:var(--soft);padding:18px}
@media(max-width:940px){.grid,.mid,.nform{grid-template-columns:1fr}.side{flex-direction:row;flex-wrap:wrap}.side .sb{width:auto}.side .lead{width:100%}}
</style></head>
<body><div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script>
/* ---------- infrastructure: storage, hooks, router state, store ---------- */

/* ---------- data ---------- */
const PAGES=[["home","🏠","Home"],["about","💜","About Me"],["notes","📓","My Notes"],["games","🎮","Games"],["gallery","🖼️","Gallery"],["contact","✉️","Contact"]];
const TAGS=["Minecraft","Cities: Skylines","Music","My Life","Dreams"], TAGI=["🟩","🏙️","🎵","⭐","☁️"];
const seedNotes=[{id:1,t:"You can do it! 💜",c:"pink",tag:"My Life",d:"2026-10-21"},{id:2,t:"Small steps, big dreams",c:"blue",tag:"Dreams",d:"2026-10-20"},{id:3,t:"Remember: you are enough",c:"yellow",tag:"My Life",d:"2026-10-19"}];
const seedTodos=[{id:1,t:"Finish my website",x:1},{id:2,t:"Play Minecraft",x:1},{id:3,t:"Learn how to build better"},{id:4,t:"Watch a tutorial"},{id:5,t:"Explore Cities: Skylines"},{id:6,t:"Be happy!"}];
const DAY=["Be kind to myself","Play some Minecraft","Watch a YouTube tutorial","Drink water","Have a good day!"];
const QUOTES=["“Better days are coming”","“Small steps, big dreams”","“Good things take time”","“You are enough”"];

/* ---------- shared UI ---------- */
const Card=({cls="",title,right,children})=>h("section",{className:"card "+cls},title&&h("h3",null,title,right),children);

/* ---------- widgets ---------- */
function Today(){

  return h(Card,{cls:"pink",title:"🐰 Today"},DAY.map(t=>h("label",{key:t,className:"chk"},h("span",null,h("input",{type:"checkbox",checked:done.includes(t),onChange:()=>setD(done.includes(t)?done.filter(x=>x!==t):[...done,t])}),t))));

function Todos(){

    todos.map(x=>h("div",{key:x.id,className:"chk"},

      h("button",{className:"x","aria-label":"Delete task",onClick:()=>setTodos(todos.filter(y=>y.id!=x.id))},"×"))));

function Player(){

    h("div",{className:"row"},h("div",{className:"cover"},"🌆"),h("div",null,h("b",null,T.n),h("div",{className:"soft"},"– "+T.s))),
    h("div",{className:"bar"},h("i",{style:{width:p.p/1.8+"%"}})),
    h("div",{className:"soft"},mmss(p.p)+" / 3:00"),
    h("div",{className:"ctl"},h("button",{onClick:p.prev,"aria-label":"Previous track"},"⏮"),h("button",{className:"big",onClick:p.toggle,"aria-label":p.on?"Pause":"Play"},p.on?"⏸":"▶"),h("button",{onClick:p.next,"aria-label":"Next track"},"⏭")));
}
function ClockCard(){
  const[n,s]=useState(new Date());
  useEffect(()=>{const i=setInterval(()=>s(new Date()),1000);return()=>clearInterval(i)},[]);
  const t=n.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit",timeZone:"Europe/Madrid"}),hr=+t.slice(0,2);
  return h(Card,null,h("div",{className:"clock"},h("span",{className:"big-emoji"},hr>=7&&hr<20?"☀️":"🌙"),h("div",null,h("b",{className:"time"},t),h("div",{className:"soft"},"Spain"))),h("p",null,"🌱 Take your time",h("br"),"You’re doing great! 💜"));
}
function NoteCard({n}){
  const{notes,setNotes}=useCtx();
  return h("div",{className:"note "+n.c},h("div",null,n.t),h("small",null,n.tag+" · "+fmt(n.d)),h("button",{className:"x","aria-label":"Delete note",onClick:()=>setNotes(notes.filter(x=>x.id!=n.id))},"×"));
}

/* ---------- pages ---------- */
function Home(){
  const{notes,go,setTag}=useCtx(),[q,setQ]=useState(0),jump=(r,t)=>{if(t)setTag(t);go(r)};
  const ints=[["🟩","Minecraft","(Survival)","notes","Minecraft"],["🏙️","Cities: Skylines","(First version)","notes","Cities: Skylines"],["🎮","Games","(also random ones!)","games"],["🎧","Music","(lofi ♡)","notes","Music"],["🐰","Cute things","(animals, art, etc.)","gallery"]];
  return h("div",{className:"grid"},
    h("aside",{className:"side"},h("div",{className:"lead"},"Good things take time ♡"),h("div",{className:"lead"},"🐱"),TAGS.map((t,i)=>h("button",{key:t,className:"sb",onClick:()=>jump("notes",t)},TAGI[i]+" "+t))),
    h("div",{className:"mid"},
      h(Card,{title:"Welcome to my little space! ✦"},h("p",null,"Hi! I’m Chika! 💜",h("br"),"This is my cozy corner on the internet. Here you can find my thoughts, hobbies, games, cute notes and more!",h("br"),"I’m so happy you’re here! ٩(◕‿◕)۶")),
      h(Today),
      h("div",{className:"banner","aria-hidden":"true"},"🐱☁️🐥"),
      h("button",{className:"quote",onClick:()=>setQ((q+1)%QUOTES.length),"aria-label":"Next quote"},QUOTES[q]),
      h("div",{className:"span"},h(Card,{title:"⭐ My Interests"},h("div",{className:"ints"},ints.map(x=>h("button",{key:x[1],className:"int",onClick:()=>jump(x[3],x[4])},h("span",null,x[0]),x[1],h("div",{className:"soft"},x[2])))))),
      h("div",{className:"span"},h(Card,{title:"📓 Latest Notes",right:h("button",{className:"chip",onClick:()=>jump("notes","All")},"View all →")},h("div",{className:"notes"},notes.slice(0,3).map(n=>h(NoteCard,{key:n.id,n}))))) ),
    h("div",{className:"right"},h(Player),h(Todos),h(ClockCard)));
}
function About(){
  const{notes,todos}=useCtx();
  return h(Card,{title:"💜 About Me"},h("p",null,"I’m Chika — I love building things in Minecraft, designing cities in Cities: Skylines, listening to lofi, and collecting cute things."),
    h("p",{className:"soft"},"Right now: "+notes.length+" notes written · "+todos.filter(t=>t.x).length+"/"+todos.length+" to-dos done."));
}
function Notes(){
  const{notes,setNotes,tag,setTag}=useCtx(),[t,setT]=useState(""),[c,setC]=useState("pink"),[g,setG]=useState("My Life");
  const add=e=>{e.preventDefault();if(!t.trim())return;setNotes([{id:Date.now(),t:t.trim(),c,tag:g,d:today()},...notes]);setT("")};
  const list=notes.filter(n=>tag=="All"||n.tag==tag);
  return h(Card,{title:"📓 My Notes"},
    h("form",{onSubmit:add,className:"nform"},
      h("textarea",{value:t,maxLength:140,onChange:e=>setT(e.target.value),placeholder:"Write a little note…","aria-label":"Note text"}),
      h("select",{value:g,onChange:e=>setG(e.target.value),"aria-label":"Tag"},TAGS.map(x=>h("option",{key:x},x))),
      h("select",{value:c,onChange:e=>setC(e.target.value),"aria-label":"Color"},["pink","blue","yellow"].map(x=>h("option",{key:x},x))),
      h("button",{className:"btn"},"Add note")),
    h("div",{className:"chips"},["All",...TAGS].map(x=>h("button",{key:x,className:"chip"+(x==tag?" on":""),onClick:()=>setTag(x)},x))),
    h("div",{className:"notes"},list.length?list.map(n=>h(NoteCard,{key:n.id,n})):h("p",{className:"soft"},"No notes here yet ✨")));
}
function Games(){
  const E=["🐱","🐰","⭐","🌙","☁️","🍓","🧸","🌸"],mk=()=>[...E,...E].sort(()=>Math.random()-.5);
  const[c,setC]=useState(mk),[o,setO]=useState([]),[m,setM]=useState([]),[mv,setMv]=useState(0),[best,setBest]=usePersist("best",0),done=m.length==8;
  useEffect(()=>{if(done&&(!best||mv<best))setBest(mv)},[done]);
  const flip=k=>{if(o.length>1||o.includes(k)||m.includes(c[k]))return;const n=[...o,k];setO(n);if(n.length==2){setMv(mv+1);if(c[n[0]]==c[k]){setM([...m,c[k]]);setO([])}else setTimeout(()=>setO([]),700)}};
  const reset=()=>{setC(mk());setO([]);setM([]);setMv(0)};
  return h(Card,{title:"🎮 Memory Match",right:h("button",{className:"chip",onClick:reset},"New game")},
    h("p",{className:"soft"},"Moves: "+mv+" · Best: "+(best||"–")+(done?" · You did it! 🎉":"")),
    h("div",{className:"gal"},c.map((e,k)=>h("button",{key:k,className:"tile t"+(m.includes(e)?1:0),"aria-label":o.includes(k)||m.includes(e)?e:"Hidden card",onClick:()=>flip(k)},h("span",null,o.includes(k)||m.includes(e)?e:"❔")))));
}
const ART=[["🐱","Nap time"],["🌙","Moon night"],["🏙️","Skyline"],["🟩","Block build"],["🎧","Lofi"],["🐰","Bunny"],["🌸","Spring"],["☁️","Clouds"]];
function Gallery(){
  const[o,setO]=useState(null);
  useEffect(()=>{const k=e=>e.key=="Escape"&&setO(null);addEventListener("keydown",k);return()=>removeEventListener("keydown",k)},[]);
  return h(Card,{title:"🖼️ Gallery"},h("div",{className:"gal"},ART.map((a,i)=>h("button",{key:i,className:"tile t"+(i%3),onClick:()=>setO(a)},h("span",null,a[0]),a[1]))),
    o&&h("div",{className:"modal",onClick:()=>setO(null)},h("div",{className:"tile big t"+(ART.indexOf(o)%3)},h("span",null,o[0]),o[1])));
}
function Contact(){
  const[f,setF]=useState({n:"",e:"",m:""}),[err,setErr]=useState(""),[ok,setOk]=useState(false),[box,setBox]=usePersist("outbox",[]);
  const u=k=>e=>{setOk(false);setF({...f,[k]:e.target.value})};
  const sub=e=>{e.preventDefault();if(!f.n.trim()||!/^\S+@\S+\.\S+$/.test(f.e)||f.m.trim().length<5){setErr("Please add your name, a valid email and a short message.");return}setBox([...box,{...f,d:Date.now()}]);setF({n:"",e:"",m:""});setErr("");setOk(true)};
  return h(Card,{title:"✉️ Contact"},ok&&h("p",null,"Thank you! Your message was saved 💜"),
    h("form",{onSubmit:sub,className:"col"},
      h("input",{type:"text",placeholder:"Your name",value:f.n,onChange:u("n"),"aria-label":"Name"}),
      h("input",{type:"email",placeholder:"Your email",value:f.e,onChange:u("e"),"aria-label":"Email"}),
      h("textarea",{placeholder:"Say hi…",value:f.m,onChange:u("m"),"aria-label":"Message"}),
      err&&h("p",{className:"err",role:"alert"},err),h("button",{className:"btn"},"Send ♡")));
}
const VIEWS={home:Home,about:About,notes:Notes,games:Games,gallery:Gallery,contact:Contact};

/* ---------- app shell ---------- */
function App(){
  const[theme,setTheme]=usePersist("theme",matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
  useEffect(()=>{document.documentElement.dataset.theme=theme},[theme]);
  const[route,setR]=useState(()=>{const x=location.hash.slice(1);return VIEWS[x]?x:"home"});
  const go=r=>{setR(r);try{history.replaceState(null,"","#"+r)}catch(e){}scrollTo(0,0)};
  const[notes,setNotes]=usePersist("notes",seedNotes),[todos,setTodos]=usePersist("todos",seedTodos),[tag,setTag]=useState("All"),player=usePlayer();
  const View=VIEWS[route];
  return h(Ctx.Provider,{value:{notes,setNotes,todos,setTodos,tag,setTag,go,player}},
    h("div",{className:"wrap"},
      h("header",{className:"hero"},h("h1",null,"Chika’s Cozy Corner ",h("span",{className:"cat","aria-hidden":"true"},"🐱")),h("p",null,"small dreams ✧ big adventures")),
      h("nav",{"aria-label":"Main"},PAGES.map(p=>h("button",{key:p[0],className:"navb"+(route==p[0]?" on":""),"aria-current":route==p[0]?"page":null,onClick:()=>go(p[0])},p[1]+" "+p[2])),
        h("button",{className:"navb","aria-label":"Toggle light or dark mode",onClick:()=>setTheme(theme=="dark"?"light":"dark")},theme=="dark"?"☀️":"🌙")),
      h("main",null,h(View)),
      h("footer",null,"Made with lots of love ♡ 🐾")));
}
ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script></body></html>
